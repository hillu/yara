name: Build and test

on: [push, pull_request]

env:
  UBSAN_OPTIONS: print_stacktrace=1

jobs:
  macosx-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          brew install \
            autoconf \
            automake \
            bison \
            flex \
            gcc@12 \
            libtool \
            pkg-config \
            jansson \
            libmagic \
            openssl@3 \
            file
      - name: Print versions
        run: |
          bison --version
          $(brew --prefix)/bin/gcc-12 --version
      - name: Prepare for building
        run: |
          ./bootstrap.sh
          ./configure --enable-debug --enable-cuckoo --enable-magic CC=$(brew --prefix)/bin/gcc-12 CPPFLAGS=-I$(brew --prefix)/include LDFLAGS=-L$(brew --prefix)/lib
      - name: Build
        run: make clean && make V=1
      - name: Run tests
        run: make check
      - name: Install, test
        run: |
          make install
          /usr/local/bin/yara --version
      - name: Print tests errors
        if: ${{ failure() }}
        run: cat test-suite.log
